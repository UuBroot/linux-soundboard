app-id: com.uubroot.Soundboard
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk//6.9
base: io.qt.PySide.BaseApp
base-version: '6.9'
command: com.uubroot.Soundboard
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music/Sounds:rw

modules:
  - name: libsndfile
    sources:
      - type: archive
        url: https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2.tar.xz
        sha256: 3799ca9924d3125038880367bf1468e53a1b7e3686a934f098b7e1d286cdb80e
    cleanup:
      - /bin

  - name: portaudio
    config-opts:
      - --with-alsa
      - --without-jack
      - --without-oss
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def
    cleanup:
      - /lib/pkgconfig

  - name: python3-packaging
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "packaging>=24.2" --ignore-installed --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/20/12/38679034af332785aac8774540895e234f4d07f7545804097de4b666afd8/packaging-25.0-py3-none-any.whl
        sha256: 29572ef2b1f17581046b3a2227d5c611fb25ec70ca1ba8554b24b0e69331a484

  - python-deps.json
  - name: soundboard-app
    buildsystem: meson
    sources:
      - type: dir
        path: .